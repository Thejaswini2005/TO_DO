<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>TaskFlow</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
        rel="stylesheet"
    />

</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">

            <span>[</span>

            TaskFlow

            <span>]</span>

        </div>

        <!-- Stats -->
        <div class="stats">

            <div class="stat-card">

                <span id="totalTasks">0</span>

                tasks

            </div>

            <div class="stat-card done">

                <span id="completedTasks">0</span>

                done

            </div>

        </div>

    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Input Section -->
        <div class="input-section">

            <div class="input-box">

                <span class="dollar">$</span>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Type a new task and hit Enter..."
                />

            </div>

            <button id="addTaskBtn">

                +
                Add

            </button>

        </div>

        <!-- Filter Buttons -->
        <div class="filters">

            <button class="filter-btn active">

                ALL

            </button>

            <button class="filter-btn">

                ACTIVE

            </button>

            <button class="filter-btn">

                COMPLETED

            </button>

        </div>

        <!-- Task List -->
        <div id="taskList">

            <!-- Tasks come dynamically from JavaScript -->

        </div>

    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">

        <div class="modal-content">

            <h2>Edit Task</h2>

            <input
                type="text"
                id="editInput"
            />

            <div class="modal-buttons">

                <button id="saveEditBtn">

                    Save

                </button>

                <button id="cancelEditBtn">

                    Cancel

                </button>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
